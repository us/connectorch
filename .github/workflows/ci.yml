name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv pip install -e ".[dev,networkx]"
      # The large MaleCNS files are never fetched in PR CI; the bundled sample
      # covers the dataset path offline.
      - name: Test
        run: >
          uv run pytest -q -m "not network and not large and not cuda"
          --cov=connectorch --cov-report=term-missing --cov-fail-under=80

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e ".[dev]"
      # No `|| true`: a green badge that guarantees nothing is worse than no badge.
      - run: uv run mypy --ignore-missing-imports src/connectorch

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv pip install -e .
      # An example that no longer runs is a broken promise in the README.
      - run: uv run python examples/01_toy_connectome.py
      - run: uv run python examples/02_train_connectome.py
      - run: uv run python examples/03_malecns_load.py
