[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "connectorch"
version = "0.0.1"
description = "Compile biological connectomes into trainable PyTorch networks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "ConnecTorch contributors" }]
keywords = ["connectome", "pytorch", "neuroscience", "sparse", "neural-networks"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.1", "numpy>=1.24", "pyarrow>=14"]

[project.optional-dependencies]
# fetch_adjacencies(omit_rois=True) arrived in 0.6.3 (2026-07-20).
neuprint = ["neuprint-python>=0.6.3"]
networkx = ["networkx>=3"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6", "mypy>=1.10", "pandas"]
docs = ["mkdocs-material", "mkdocstrings[python]"]

[project.scripts]
connectorch = "connectorch.cli.main:main"

[project.urls]
Homepage = "https://github.com/us/connectorch"
Issues = "https://github.com/us/connectorch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/connectorch"]
# The bundled MaleCNS sample is data, not Python; hatchling needs telling.
artifacts = ["src/connectorch/datasets/data/**"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Never touch prose. Formatting fenced code inside Markdown rewrites the
# specification documents, which are inputs, not source.
extend-exclude = ["*.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: requires network access and credentials",
    "large: requires the full MaleCNS dataset and a large machine",
    "cuda: requires a CUDA device",
    "mps: requires an Apple GPU and torch.mps.compile_shader",
]

[tool.mypy]
# Left at the running interpreter's version: pinning it to 3.10 makes mypy
# refuse to parse numpy's own stubs, which use 3.12 syntax.
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src/connectorch"]
